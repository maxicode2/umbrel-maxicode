version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: skibidi-steel-browser_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/steel-dev/steel-browser:latest
    restart: on-failure
    init: true
    hostname: steel-browser
    shm_size: "2gb"
    stop_grace_period: 30s
    environment:
      CHROME_HEADLESS: "true"
      CHROME_USER_DATA_DIR: /data/chrome
      DOMAIN: ${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
    volumes:
      - ${APP_DATA_DIR}/data/chrome:/data/chrome
      - ${APP_DATA_DIR}/data/files:/files
